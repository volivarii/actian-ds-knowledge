# scripts/spike diagnostic (dispatch-only; never runs automatically).
# Runs the read-only nested-resolution diagnostic against a live Figma fetch and
# uploads the report artifact. Throwaway: remove after the slice-2 decision.
name: Spike - nested resolution diagnostic

on:
  workflow_dispatch: {}

jobs:
  diagnose:
    name: Nested-resolution diagnostic
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Run diagnostic
        env:
          FIGMA_PAT: ${{ secrets.FIGMA_PAT }}
          FIGMA_KEYS_JSON: ${{ secrets.FIGMA_KEYS_JSON }}
          SPIKE_REPORT_PATH: nested-resolution-report.json
        run: node scripts/spike/diagnose-nested-resolution.js

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nested-resolution-report
          path: nested-resolution-report.json
          if-no-files-found: warn
