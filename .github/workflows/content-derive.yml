name: Derive content guidelines (global.md + bucket splits)

# Global / cross-cutting content guidelines auto-generated from the
# per-section source files. Runs on PR events that touch the sources or
# the generator; regenerates content/dist/global.md plus the per-bucket
# split views (writing.md, patterns.md, product.md) and commits them back
# to the PR branch.
#
# Phase 5 (knowledge v0.11.0): the transitional content/dist/content.md
# full-concat output was retired; component-scoped content lives in
# components/dist/guidelines/<slug>.json `domains.content` instead.
#
# Required repo setting (already enabled for foundations-derive):
#   Settings → Actions → General → Workflow permissions → Allow GH Actions
#     to create and approve pull requests
#
# Required for the auto-commit re-trigger: vars.BOT_APP_ID +
# secrets.BOT_APP_PRIVATE_KEY — the actian-ds-bot GitHub App, shared with
# sync-from-figma.yml and the other derive workflows. Without it the
# auto-commit lands with the default GITHUB_TOKEN, which cannot re-trigger
# the required checks on the new HEAD (the recurring blocked-PR gotcha).

on:
  pull_request:
    paths:
      - 'content/src/**/*.md'
      - 'scripts/content/derive-content.js'

# Serialize runs per branch: concurrent auto-commit pushes to the same PR
# head race each other (lost push = red required check). Queue, never cancel:
# cancelling mid-push could strand a half-committed dist.
concurrency:
  group: content-derive-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  derive:
    name: Derive content guidelines
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # App token for the auto-commit push below — a commit pushed with the
      # default GITHUB_TOKEN cannot trigger further workflow runs, leaving the
      # required checks with no status on the auto-commit's SHA. Skipped on
      # fork PRs (secret not exposed); checkout falls back to github.token.
      - name: Generate App token
        id: app-token
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Derive content dist (global.md + bucket splits)
        run: |
          node scripts/content/derive-content.js \
            --src content/src \
            --index content/src/content-index.md

      - name: Run tests against regenerated output
        run: npm test

      - name: Detect changes
        id: diff
        run: |
          # git status, NOT git diff. `git diff` reports only files git already
          # TRACKS, so a regeneration that ADDS a file is invisible to it and the
          # bump, the auto-commit and the tag never happen. Corrected in
          # app-context-derive.yml first (b4ab8340, knowledge #574); applied to every
          # derive here so the rule has no exceptions to remember (#575).
          # Capture and check git's own exit status BEFORE testing the value.
          # `[ -z "$(git ...)" ]` sees only stdout, and a git failure (dubious
          # ownership, a stuck index.lock, a corrupt index) prints nothing, so the
          # empty-string branch would report "no changes": green check, no bump, no
          # tag. `git diff --quiet` at least exited 128 and failed loudly downstream.
          # --untracked-files=all because status.showUntrackedFiles=no would
          # otherwise silently restore the added-file blindness this exists to remove.
          CHANGED="$(git status --porcelain --untracked-files=all -- content/dist/)" || {
            echo "::error::git status failed while detecting changes"
            exit 1
          }
          if [ -z "$CHANGED" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No content/dist/ changes after regeneration."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Content changes detected:"
            printf '%s\n' "$CHANGED"
          fi

      - name: Auto-bump package.json patch
        if: steps.diff.outputs.changed == 'true'
        run: node scripts/lib/bump-version.js package.json patch

      # Skip on fork PRs — GITHUB_TOKEN can't push to forks.
      - name: Commit derived content back to PR
        if: steps.diff.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/dist/ package.json paths-manifest.json package-lock.json
          git commit -m "chore(content): regenerate content dist + bump patch"
          # Race-safe push: another derive workflow may have pushed to this
          # branch since checkout (concurrent auto-commits) — rebase and retry
          # once instead of failing the required check on a lost race.
          # --autostash: npm install rewrites the stale tracked package-lock.json
          # in every run, and a dirty tree makes a bare rebase refuse to start.
          git push || (git pull --rebase --autostash && git push)

      - name: Summarize
        if: always()
        run: |
          if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            echo "### Content derive: regenerated" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Content derive: no changes" >> "$GITHUB_STEP_SUMMARY"
          fi
