name: Derive categories

on:
  pull_request:
    paths:
      - 'components/src/categories/**'
      - 'scripts/categories/**'
      - '.github/workflows/categories-derive.yml'

jobs:
  derive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run unit tests
        run: node --test tests/categories-derive.test.js

      - name: Derive category defaults
        run: node scripts/categories/__cli.js

      - name: Commit regenerated dist files
        run: |
          if git diff --quiet -- components/dist/categories/; then
            echo "No dist changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add components/dist/categories/
          git commit -m "chore(categories): regenerate dist from src"
          git push
