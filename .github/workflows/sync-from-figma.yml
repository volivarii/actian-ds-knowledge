name: Sync from Figma

# Federation Phase 1.1 — knowledge-repo CI lifted from Actian-DS-Claude-plugin's
# .github/workflows/sync-from-figma.yml. Runs the sync orchestrator at
# scripts/sync/sync-from-figma.js to fetch DS Kit / FM Kit / Meta Kit registries
# and DS Kit text+effect styles via Figma REST, classifies the diff, writes a
# changelog. Additive diffs auto-merge; breaking diffs labeled `review-required`.
#
# Required repo secrets:
#   FIGMA_PAT             — Figma Personal Access Token (Pro tier sufficient)
#   FIGMA_KEYS_JSON       — JSON string of file keys; mirrors the local
#                           .figma-keys.json file (gitignored). CI materializes
#                           the file from this secret on each run.
#   BOT_APP_PRIVATE_KEY   — PEM private key for the actian-ds-bot GitHub App.
#                           Used to mint a token so the sync PR is authored by
#                           the App (not github-actions[bot]). Default GITHUB_TOKEN
#                           suppresses downstream pull_request workflows, which
#                           leaves the PR BLOCKED when the ruleset requires named
#                           status checks (validate-manifest, validate-schemas).
#                           See plugin's vendor-snapshot.yml + memory
#                           project_vendor_bot_app_identity.md for forensics.
#
# Required repo variables:
#   BOT_APP_ID            — actian-ds-bot App ID (currently 3678502).
#
# Required repo settings:
#   Settings → General → Pull Requests → Allow auto-merge → ENABLED
#     (Required for the `gh pr merge --auto` step.)

on:
  schedule:
    - cron: '0 7 * * *'  # 07:00 UTC daily
  workflow_dispatch:
    inputs:
      phase:
        description: 'Sync phase'
        default: 'all'
        type: choice
        options:
          - all
          - registries
          - styles
          - media-preview

jobs:
  sync:
    name: Sync Figma → JSON
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # The media-preview phase transcodes Figma PNG captures to WebP via
      # sharp — a real dependency, so install before running the sync.
      - name: Install dependencies
        run: npm ci

      # Mint a token from the actian-ds-bot GitHub App so the sync PR is
      # authored by the App, not github-actions[bot]. Required because the
      # default GITHUB_TOKEN suppresses downstream pull_request workflow
      # triggers — the PR ends up with no status checks, and the ruleset
      # blocks merge waiting for them. App-authored PRs fire pull_request
      # events normally so validate-manifest / validate-schemas / etc. run.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Materialize .figma-keys.json from secret
        env:
          FIGMA_KEYS_JSON: ${{ secrets.FIGMA_KEYS_JSON }}
        run: |
          if [ -z "$FIGMA_KEYS_JSON" ]; then
            echo "::error::FIGMA_KEYS_JSON secret is not set. See workflow file header for setup."
            exit 1
          fi
          printf '%s' "$FIGMA_KEYS_JSON" > .figma-keys.json
          echo "Wrote .figma-keys.json ($(wc -c < .figma-keys.json) bytes)"

      - name: Run sync orchestrator
        id: sync
        continue-on-error: true
        env:
          FIGMA_PAT: ${{ secrets.FIGMA_PAT }}
        run: |
          PHASE="${{ github.event.inputs.phase || 'all' }}"
          node scripts/sync/sync-from-figma.js \
            --phase "$PHASE" \
            --plugin-dir . \
            --output-dir components/dist/registries \
            --release-notes-dir release-notes \
            --keys-file .figma-keys.json \
            --plugin-json-path package.json \
            --manifest-path paths-manifest.json \
            --categories-path components/dist/categories.json \
            --icon-groups-path components/src/icon-groups.json

      - name: Render token-reference.md
        run: node scripts/render-token-reference.js

      - name: Render styles MDs (text-styles.md, effect-styles.md)
        run: node scripts/styles-to-md.js

      - name: Read verdict
        id: verdict
        run: |
          if [ -f /tmp/sync-verdict.txt ]; then
            VERDICT=$(tr -d '[:space:]' < /tmp/sync-verdict.txt)
          else
            VERDICT=error
          fi
          echo "category=$VERDICT" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "Sync verdict: $VERDICT"

      - name: Open pull request
        id: cpr
        if: steps.verdict.outputs.category == 'additive' || steps.verdict.outputs.category == 'breaking'
        uses: peter-evans/create-pull-request@v7
        with:
          # App token (not default GITHUB_TOKEN) so the PR fires pull_request
          # workflows against its head SHA. Required for the ruleset's named
          # status checks (validate-manifest, validate-schemas, derive-*).
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "sync(figma): ${{ steps.verdict.outputs.category }} refresh ${{ steps.verdict.outputs.date }}"
          title: "sync(figma): ${{ steps.verdict.outputs.category }} — ${{ steps.verdict.outputs.date }}"
          body-path: /tmp/sync-changelog.md
          branch: "sync/figma-${{ steps.verdict.outputs.date }}"
          labels: ${{ steps.verdict.outputs.category == 'additive' && 'sync,auto-merge' || 'sync,review-required' }}
          delete-branch: true
          add-paths: |
            components/**
            tokens/**
            package.json
            paths-manifest.json

      - name: Enable auto-merge for additive PRs
        if: steps.verdict.outputs.category == 'additive' && steps.cpr.outputs.pull-request-number
        env:
          # Same App token — gh CLI auto-merge call attributes to the App.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --auto --squash --repo "${{ github.repository }}"

      - name: Tag release
        if: steps.verdict.outputs.category == 'additive' || steps.verdict.outputs.category == 'breaking'
        run: |
          VERSION=$(jq -r .version package.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists locally, skipping"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION" || echo "Tag push failed (likely already exists on remote)"
          fi

      - name: Summarize
        if: always()
        run: |
          echo "### Sync result: ${{ steps.verdict.outputs.category }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.cpr.outputs.pull-request-number }}" ]; then
            echo "PR: #${{ steps.cpr.outputs.pull-request-number }} — ${{ steps.cpr.outputs.pull-request-url }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f /tmp/sync-changelog.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/sync-changelog.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail job on sync error
        if: steps.verdict.outputs.category == 'error'
        run: |
          echo "::error::Sync orchestrator reported errors. See logs above."
          exit 1
