name: Sync from Figma

# Federation Phase 1.1 — knowledge-repo CI lifted from Actian-DS-Claude-plugin's
# .github/workflows/sync-from-figma.yml. Runs the sync orchestrator at
# scripts/sync/sync-from-figma.js to fetch DS Kit / FM Kit / Meta Kit registries
# and DS Kit text+effect styles via Figma REST, classifies the diff, writes a
# changelog. Additive diffs open a same-day auto-merging PR; breaking diffs open
# (or re-edit) ONE rolling tracking issue for a human to follow through, never a
# PR -- see the "Upsert breaking-sync tracking issue" step for why.
#
# Required repo secrets:
#   FIGMA_PAT             — Figma Personal Access Token (Pro tier sufficient)
#   FIGMA_KEYS_JSON       — JSON string of file keys; mirrors the local
#                           .figma-keys.json file (gitignored). CI materializes
#                           the file from this secret on each run.
#   BOT_APP_PRIVATE_KEY   — PEM private key for the actian-ds-bot GitHub App.
#                           Used to mint a token so the sync PR is authored by
#                           the App (not github-actions[bot]). Default GITHUB_TOKEN
#                           suppresses downstream pull_request workflows, which
#                           leaves the PR BLOCKED when the ruleset requires named
#                           status checks (validate-manifest, validate-schemas).
#                           See plugin's vendor-snapshot.yml + memory
#                           project_vendor_bot_app_identity.md for forensics.
#
# Required repo variables:
#   BOT_APP_ID            — actian-ds-bot App ID (currently 3678502).
#
# Required repo settings:
#   Settings → General → Pull Requests → Allow auto-merge → ENABLED
#     (Required for the `gh pr merge --auto` step.)

on:
  schedule:
    - cron: '0 7 * * *'  # 07:00 UTC daily
  workflow_dispatch:
    inputs:
      phase:
        description: 'Sync phase'
        default: 'all'
        type: choice
        options:
          - all
          - registries
          - styles
          - media-preview
          - anatomy
          - media-default
          - icons
          - graphics

# A manual dispatch racing the nightly cron would fight over the same
# sync/figma-<date> branch — serialize all sync runs.
concurrency:
  group: sync-from-figma
  cancel-in-progress: false

jobs:
  sync:
    name: Sync Figma → JSON
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # The media-preview phase transcodes Figma PNG captures to WebP via
      # sharp — a real dependency, so install before running the sync.
      - name: Install dependencies
        run: npm ci

      # Mint a token from the actian-ds-bot GitHub App so the sync PR is
      # authored by the App, not github-actions[bot]. Required because the
      # default GITHUB_TOKEN suppresses downstream pull_request workflow
      # triggers — the PR ends up with no status checks, and the ruleset
      # blocks merge waiting for them. App-authored PRs fire pull_request
      # events normally so validate-manifest / validate-schemas / etc. run.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Materialize .figma-keys.json from secret
        env:
          FIGMA_KEYS_JSON: ${{ secrets.FIGMA_KEYS_JSON }}
        run: |
          if [ -z "$FIGMA_KEYS_JSON" ]; then
            echo "::error::FIGMA_KEYS_JSON secret is not set. See workflow file header for setup."
            exit 1
          fi
          printf '%s' "$FIGMA_KEYS_JSON" > .figma-keys.json
          echo "Wrote .figma-keys.json ($(wc -c < .figma-keys.json) bytes)"

      - name: Run sync orchestrator
        id: sync
        continue-on-error: true
        env:
          FIGMA_PAT: ${{ secrets.FIGMA_PAT }}
        run: |
          PHASE="${{ github.event.inputs.phase || 'all' }}"
          node scripts/sync/sync-from-figma.js \
            --phase "$PHASE" \
            --plugin-dir . \
            --output-dir components/dist/registries \
            --release-notes-dir release-notes \
            --keys-file .figma-keys.json \
            --plugin-json-path package.json \
            --manifest-path paths-manifest.json \
            --categories-path components/dist/categories.json \
            --icon-groups-path components/src/icon-groups.json

      - name: Render token-reference.md
        run: node scripts/render-token-reference.js

      - name: Render styles MDs (text-styles.md, effect-styles.md)
        run: node scripts/styles-to-md.js

      - name: Read verdict
        id: verdict
        run: |
          if [ -f /tmp/sync-verdict.txt ]; then
            VERDICT=$(tr -d '[:space:]' < /tmp/sync-verdict.txt)
          else
            VERDICT=error
          fi
          echo "category=$VERDICT" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "Sync verdict: $VERDICT"

      # Only ADDITIVE syncs open a PR, and it auto-merges the same day. Breaking
      # syncs no longer open a PR at all -- see the tracking-issue step below.
      # A breaking sync always needs human follow-through before it can merge
      # (a slug rename, a re-grounding, a retired enum value; see #475), so a
      # dated PR every night was a notification wearing a PR costume: they piled
      # up, went stale against a moving main, and any follow-through on one
      # branch was orphaned when the next night opened another. A rolling issue
      # says the same thing once, without the stale-PR debris.
      - name: Open pull request
        id: cpr
        if: steps.verdict.outputs.category == 'additive'
        uses: peter-evans/create-pull-request@v7
        with:
          # App token (not default GITHUB_TOKEN) so the PR fires pull_request
          # workflows against its head SHA. Required for the ruleset's named
          # status checks (validate-manifest, validate-schemas, derive-*).
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "sync(figma): additive refresh ${{ steps.verdict.outputs.date }}"
          title: "sync(figma): additive — ${{ steps.verdict.outputs.date }}"
          body-path: /tmp/sync-changelog.md
          branch: "sync/figma-${{ steps.verdict.outputs.date }}"
          labels: sync,auto-merge
          delete-branch: true
          add-paths: |
            components/**
            tokens/**
            package.json
            paths-manifest.json
            package-lock.json

      - name: Enable auto-merge for additive PRs
        if: steps.verdict.outputs.category == 'additive' && steps.cpr.outputs.pull-request-number
        env:
          # Same App token — gh CLI auto-merge call attributes to the App.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --auto --squash --repo "${{ github.repository }}"

      # A breaking sync opens (or updates) ONE rolling tracking issue instead of
      # a PR. The same issue is edited every night it stays breaking, so the
      # signal is said once and never accumulates. A human runs the sync into a
      # branch and does the follow-through when ready -- which needs a local
      # branch anyway -- then the CHANGELOG entry rides that human PR, the way
      # every breaking-sync entry already does in practice (see #475). The
      # registry regeneration this job produced is not pushed anywhere: it is
      # reproduced by the human sync, which is where the follow-through lives.
      - name: Upsert breaking-sync tracking issue
        if: steps.verdict.outputs.category == 'breaking'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DATE: ${{ steps.verdict.outputs.date }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          MARKER="<!-- rolling-tracker: breaking-sync -->"
          # Idempotent: the marker label must exist before create/edit can use it.
          # The label is now a convenience for humans filtering the issue list, NOT
          # the dedupe key (see the marker note below).
          gh label create sync-breaking \
            --repo "$REPO" \
            --color B60205 \
            --description "Rolling tracker: latest breaking Figma sync awaiting follow-through" \
            2>/dev/null || true

          TITLE="Breaking Figma sync — needs follow-through (latest: ${DATE})"
          BODY_FILE=/tmp/breaking-issue-body.md
          {
            # Dedupe marker, in the BODY. The label alone was the dedupe key until
            # 2026-07-29 and it silently stopped applying: `gh issue create
            # --label sync-breaking` reported success while creating an UNLABELLED
            # issue, so the next night's label lookup found nothing and opened
            # another one. Five duplicates (#504-#508) before anyone noticed, all
            # while the step printed "Opened rolling breaking-sync issue." A marker
            # we write ourselves cannot half-apply: it is either in the body we
            # just posted or the post failed.
            echo "$MARKER"
            echo ""
            echo "**A breaking Figma sync landed and needs a human to carry it through.** A breaking"
            echo "sync is never mergeable as-is: it typically renames a slug, retires a variant, or"
            echo "re-grounds colours, each of which touches editable source the sync cannot edit for you."
            echo ""
            echo "This issue is the single rolling tracker. It is re-edited every night the sync stays"
            echo "breaking, so it always reflects the **current** upstream state, not a pile of stale PRs."
            echo ""
            echo "### To handle it"
            echo "1. \`git checkout -b sync/figma-${DATE} origin/main\`"
            echo "2. Run the sync locally (\`node scripts/sync/sync-from-figma.js --phase all ...\`, or the"
            echo "   \`workflow_dispatch\` on this workflow against your branch)."
            echo "3. Follow the renames/re-groundings through editable source until the suite is green"
            echo "   (renderer switch, \`components/src/\`, content patterns, manifest, tests)."
            echo "4. Add the CHANGELOG entry describing the decisions, and open the PR yourself."
            echo ""
            echo "---"
            echo ""
            echo "_Latest diff summary (${DATE}):_"
            echo ""
            if [ -f /tmp/sync-changelog.md ]; then
              cat /tmp/sync-changelog.md
            else
              echo "_(no diff summary emitted this run)_"
            fi
          } > "$BODY_FILE"

          # Find the tracker by the marker in its body. Listed and filtered locally
          # rather than via `--search "... in:body"`, because code search is an
          # index with its own lag and this must be exact on the run that follows
          # a create.
          # Whole list captured per call, never piped into `head`: under
          # `pipefail` an early-closing reader can SIGPIPE gh and fail the step
          # for a reason that has nothing to do with the query.
          SCAN_LIMIT=500
          trackers() {
            gh issue list --repo "$REPO" --state open --limit "$SCAN_LIMIT" \
              --json number,body \
              --jq '[.[] | select(.body != null and (.body | contains("'"$MARKER"'"))) | .number] | sort | .[]'
          }
          count_trackers() {
            printf '%s' "$1" | grep -c . || true
          }

          # The scan is bounded, so say when the bound is reached. An unreported
          # cap is how the dedupe would start failing again: the tracker sits
          # past the horizon, the lookup finds nothing, and a duplicate opens
          # while every message still reads like success.
          OPEN_COUNT=$(gh issue list --repo "$REPO" --state open --limit "$SCAN_LIMIT" --json number --jq 'length')
          if [ "$OPEN_COUNT" -ge "$SCAN_LIMIT" ]; then
            echo "::warning::Scanned ${OPEN_COUNT} open issues, which is the ${SCAN_LIMIT} cap: the tracker lookup may be truncated. Raise SCAN_LIMIT."
          fi

          FOUND=$(trackers)
          EXISTING=$(printf '%s\n' "$FOUND" | sed -n '1p')

          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --repo "$REPO" --title "$TITLE" --body-file "$BODY_FILE" \
              --add-label sync-breaking
            echo "Updated rolling breaking-sync issue #${EXISTING}."
          else
            gh issue create --repo "$REPO" --label sync-breaking \
              --title "$TITLE" --body-file "$BODY_FILE"
            echo "Opened rolling breaking-sync issue."
          fi

          # Assert the postcondition this step exists to produce: ONE open tracker.
          # The old step's success message was "I ran", not "it worked", which is how
          # five duplicates accumulated unremarked. Anything other than exactly one
          # means the dedupe is broken again, and saying so here is the whole point.
          AFTER=$(trackers)
          COUNT=$(count_trackers "$AFTER")
          if [ "$COUNT" != "1" ]; then
            echo "::error::Expected exactly 1 open breaking-sync tracker after this step, found ${COUNT}. Dedupe is broken: $(printf '%s' "$AFTER" | tr '\n' ' ')"
            exit 1
          fi
          echo "Postcondition OK: exactly 1 open breaking-sync tracker."

      - name: Summarize
        if: always()
        run: |
          echo "### Sync result: ${{ steps.verdict.outputs.category }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.cpr.outputs.pull-request-number }}" ]; then
            echo "PR: #${{ steps.cpr.outputs.pull-request-number }} — ${{ steps.cpr.outputs.pull-request-url }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f /tmp/sync-changelog.md ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/sync-changelog.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail job on sync error
        if: steps.verdict.outputs.category == 'error'
        run: |
          echo "::error::Sync orchestrator reported errors. See logs above."
          exit 1

      # Self-managing failure surfacing — these run AFTER the fail step so
      # success()/failure() reflect the real job outcome. A silent nightly
      # failure once blocked the whole sync (icons/tokens/components/media) for a
      # week; this turns that into a single tracking issue that opens on failure
      # and closes when a sync next succeeds. Uses the default GITHUB_TOKEN
      # (issues don't need the App-token downstream-trigger workaround PRs do).
      - name: Resolve sync-failure issue on success
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Best-effort: a notification hiccup must never flip a good sync to failed.
        run: |
          for n in $(gh issue list --state open --label sync-failure --json number --jq '.[].number' 2>/dev/null || true); do
            gh issue close "$n" --comment "✅ Sync succeeded again — $RUN_URL" || true
          done

      - name: Notify on sync failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERDICT: ${{ steps.verdict.outputs.category }}
        # Best-effort (the job has already failed; don't mask the real error).
        run: |
          # The sync classifies its own failure so this issue can state the real
          # remedy. `auth` means Figma rejected the credential on every phase; an
          # expired PAT went undiagnosed for 11 nights (2026-07-30 onward) while
          # this issue advised hunting a dangling icon override, which is the
          # right advice for `content` and a wasted log-read for `auth`.
          KIND=none
          if [ -f /tmp/sync-failure-kind.txt ]; then
            KIND=$(tr -d '[:space:]' < /tmp/sync-failure-kind.txt)
          fi
          if [ "$KIND" = "auth" ]; then
            TITLE="🔑 Figma sync is failing: the Figma credential is rejected"
            CAUSE="**Figma rejected the credential on every phase** (401/403 \`Token has expired\` / \`Invalid token\`), so no phase reached any content. Rotate the Figma PAT and update the \`FIGMA_KEYS_JSON\` repo secret, then re-run this workflow. Nothing in the log indicates a content or curated-override problem, and no upstream change has been observed since the credential stopped working, so treat every day since as unobserved rather than unchanged."
          else
            TITLE="🔴 Figma sync is failing"
            CAUSE="Common cause: a Figma component was renamed/removed so a curated override now dangles (e.g. an icon slug in \`components/src/icons-svg.json\`). The icons phase warn-skips dangling *curated* slugs; check the run log for the failing phase."
          fi
          # One tracking issue, not one per night: ensure the dedupe label, then
          # comment on the open issue if present, else open a new one.
          gh label create sync-failure --color B60205 --description "Nightly Figma sync is failing" 2>/dev/null || true
          existing=$(gh issue list --state open --label sync-failure --json number --jq '.[0].number // empty' 2>/dev/null || true)
          note="Run: $RUN_URL"$'\n'"Verdict: \`${VERDICT:-unknown}\` · Failure kind: \`${KIND}\`"
          if [ -n "$existing" ]; then
            # Re-title too: a run that starts failing for a NEW reason must not keep
            # wearing the old diagnosis (this issue is long-lived by design).
            gh issue edit "$existing" --title "$TITLE" || true
            gh issue comment "$existing" --body "Still failing. $note"$'\n\n'"$CAUSE" || true
          else
            gh issue create --title "$TITLE" --label sync-failure \
              --body "The nightly **Sync from Figma** workflow failed and will keep failing until fixed."$'\n\n'"$note"$'\n\n'"$CAUSE"$'\n\n'"This issue auto-closes when a sync next succeeds." || true
          fi

      # Category drift is a GREEN outcome, not a failure: a Figma reorg
      # re-bucketed components and the sync carried their last-known category
      # forward instead of reding (see preserveKnownCategories). It still must
      # reach a human, so mirror the sync-failure issue as a non-blocking,
      # auto-closing `category-drift` issue driven by the drift count the sync
      # writes to /tmp/sync-drift.txt. Skipped on an error verdict (the
      # sync-failure issue owns that), and on a narrow-phase dispatch that never
      # ran the registries phase (drift was not evaluated, so leave the issue be).
      - name: Manage category-drift issue
        if: steps.verdict.outputs.category != 'error' && (github.event.inputs.phase == 'registries' || (github.event.inputs.phase || 'all') == 'all')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Best-effort: a notification hiccup must never flip a good sync to failed.
        run: |
          DRIFT=0
          [ -f /tmp/sync-drift.txt ] && DRIFT=$(tr -d '[:space:]' < /tmp/sync-drift.txt)
          if [ "${DRIFT:-0}" -gt 0 ]; then
            gh label create category-drift --color FBCA04 --description "Figma page attribution drifted; categories preserved" 2>/dev/null || true
            note="Run: $RUN_URL"$'\n'"$DRIFT component(s) kept their last-known category this sync because Figma page attribution changed. The per-component list is in the sync run log (linked above), and in the sync PR body when this sync opened one. This is not a loss; it self-clears once the Figma file settles, or accept the moves in \`components/src/category-page-overrides.json\`."
            existing=$(gh issue list --state open --label category-drift --json number --jq '.[0].number // empty' 2>/dev/null || true)
            if [ -n "$existing" ]; then
              gh issue comment "$existing" --body "Still drifting ($DRIFT). $note" || true
            else
              gh issue create --title "🛟 Figma category attribution is drifting" --label category-drift \
                --body "The nightly sync is carrying components' last-known categories forward because the Figma file is being reorganized."$'\n\n'"$note"$'\n\n'"This issue auto-closes when a sync sees zero drift." || true
            fi
          else
            for n in $(gh issue list --state open --label category-drift --json number --jq '.[].number' 2>/dev/null || true); do
              gh issue close "$n" --comment "✅ No category drift this sync. $RUN_URL" || true
            done
          fi
