name: Auto-tag on merge to main

# Emits a git tag matching package.json#version after every merge to main,
# IF the tag doesn't already exist.
#
# This is the SINGLE SOURCE of release tags. Tags are emitted ONLY here, on
# main, so every tag points at a real main commit whose version is consistent
# (package.json == knowledge_version, both derived per #182). Do NOT re-add
# `git tag` to the derive workflows: they run on PR branches, so a branch tag
# is orphaned the moment the PR squash-merges to a different main commit — the
# off-main-orphan bug that broke consumer vendor-integrity (e.g. v0.25.5/v0.25.6).
#
# TRIGGERS (both needed):
#   - push to main (package.json changed) — fires for human/direct merges.
#   - pull_request closed (package.json changed) — fires for the App-authored
#     sync/vendor PRs that auto-merge. Their merge is completed by GitHub's
#     auto-merge, and the resulting push to main is attributed to the
#     actian-ds-bot App installation — GitHub suppresses `push`-triggered
#     workflows for App-installation pushes (the same reason the sync workflow
#     uses the App token to open PRs so PR checks fire). The pull_request
#     lifecycle event is NOT suppressed for App-authored PRs, so it is the
#     reliable path for bot merges. Both triggers fire for human merges; the
#     idempotent tag-exists check + push-race guard make the duplicate a no-op.
#     Without
#     it, syncs bump the version but never get tagged, and the plugin vendor
#     (which resolves by release TAG) lags a release behind (observed 2026-06-11
#     with v0.33.1: had to tag manually).
#
# Idempotent via the tag-exists check — safe to run twice for the same version.
# Uses the actian-ds-bot App token so the tag is pushed under the bot identity
# (and so any tag-watching automation sees an App-attributed ref, not the
# suppressed default GITHUB_TOKEN).

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
  pull_request:
    types:
      - closed
    paths:
      - 'package.json'

jobs:
  tag:
    name: Emit version tag
    # push events always run; PR events only when the PR was MERGED into main.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout main
        uses: actions/checkout@v5
        with:
          # Always read main's tip (post-merge) — in the pull_request context the
          # default ref would be the PR merge ref, not the updated base branch.
          ref: main
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}

      - name: Fetch tags
        run: git fetch --tags --depth=1

      - name: Read version
        id: ver
        run: |
          VERSION=$(jq -r .version package.json)
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::package.json#version is missing or null"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved package.json#version → $VERSION"

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.ver.outputs.version }} already exists — skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag v${{ steps.ver.outputs.version }} does NOT exist — will create"
          fi

      - name: Create + push tag
        if: steps.check.outputs.exists == 'false'
        run: |
          V="v${{ steps.ver.outputs.version }}"
          git config user.name "actian-ds-bot[bot]"
          git config user.email "actian-ds-bot[bot]@users.noreply.github.com"
          git tag "$V"
          # Both triggers (push + pull_request:closed) can fire for the same merge;
          # if they race past the exists-check, treat a lost push race (tag already
          # on the remote) as success rather than a spurious red run.
          git push origin "$V" || {
            git fetch --tags
            if git rev-parse "$V" >/dev/null 2>&1; then
              echo "$V already pushed by the concurrent trigger — OK"
            else
              exit 1
            fi
          }

      - name: Summarize
        if: always()
        run: |
          if [ "${{ steps.check.outputs.exists }}" = "false" ]; then
            echo "### Tagged v${{ steps.ver.outputs.version }} (via ${{ github.event_name }})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No tag emitted (v${{ steps.ver.outputs.version }} already exists)" >> "$GITHUB_STEP_SUMMARY"
          fi
