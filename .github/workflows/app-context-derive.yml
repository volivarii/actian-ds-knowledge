name: Derive app-context dist from src records

# Mirrors categories-derive.yml. Triggers on changes to app-context src files,
# the derive script, or the app-context schemas. Regenerates
# app-context/dist/app-context.json + app-context/dist/app-context.bundle.json
# + paths-manifest.json entries, then auto-commits the dist back to the PR branch.
#
# Required repo setting (already enabled for sync-from-figma workflow):
#   Settings → Actions → General → Workflow permissions → Allow GH Actions
#     to create and approve pull requests
#
# The auto-commit pushes with the actian-ds-bot App token (vars.BOT_APP_ID +
# secrets.BOT_APP_PRIVATE_KEY) so it re-triggers the required checks on the new
# HEAD SHA — a GITHUB_TOKEN push cannot. Shared with categories-derive.yml.

on:
  pull_request:
    paths:
      - 'app-context/src/**'
      - 'scripts/app-context/**'
      - 'scripts/lib/dist-io.js'
      - 'schemas/app-context*.json'
      # paths-manifest.json is intentionally NOT in this trigger list.
      # It's an OUTPUT of this workflow (auto-regenerated by derive-app-context.js).
      # Including it would cause a second redundant CI run after every auto-commit.

# Serialize runs per branch: concurrent auto-commit pushes to the same PR
# head race each other (lost push = red required check). Queue, never cancel:
# cancelling mid-push could strand a half-committed dist.
concurrency:
  group: app-context-derive-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  derive:
    name: Derive app-context dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # App token for the auto-commit push below. A commit pushed with the
      # default GITHUB_TOKEN cannot trigger further workflow runs, leaving the
      # required checks with no status on the auto-commit's SHA and blocking
      # merge. Skipped on fork PRs — BOT_APP_PRIVATE_KEY is not exposed to
      # them; checkout then falls back to github.token (the commit step
      # already skips on forks).
      - name: Generate App token
        id: app-token
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Derive app-context dist
        run: |
          node scripts/app-context/__cli.js

      - name: Run tests against regenerated output
        run: npm test

      - name: Detect changes
        id: diff
        run: |
          # git status, NOT git diff. `git diff` reports only files git already
          # tracks, so a brand-new per-slug dist leaf is invisible to it: adding
          # the first recipe for an existing pattern regenerated a new
          # app-context/dist/recipes/<slug>.json, the step read "No dist changes
          # after regeneration", and the bump, the commit and therefore the tag
          # never happened. The required check then stayed red forever, because
          # tests/app-context-recipes.test.js enforces src<->dist parity and the
          # dist it wanted was the one this step declined to commit. The earlier
          # recipes only bumped because their PR also modified a tracked file.
          # `git status --porcelain` reports modified AND untracked.
          # Capture and check git's own exit status BEFORE testing the value.
          # `[ -z "$(git ...)" ]` sees only stdout, and a git failure (dubious
          # ownership, a stuck index.lock, a corrupt index) prints nothing, so the
          # empty-string branch would report "no changes": green check, no bump, no
          # tag. `git diff --quiet` at least exited 128 and failed loudly downstream.
          # --untracked-files=all because status.showUntrackedFiles=no would
          # otherwise silently restore the added-file blindness this exists to remove.
          CHANGED="$(git status --porcelain --untracked-files=all -- app-context/dist/ paths-manifest.json)" || {
            echo "::error::git status failed while detecting changes"
            exit 1
          }
          if [ -z "$CHANGED" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dist changes after regeneration."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Dist changes detected:"
            printf '%s\n' "$CHANGED"
          fi

      - name: Auto-bump package.json patch
        if: steps.diff.outputs.changed == 'true'
        run: |
          node scripts/lib/bump-version.js package.json patch

      # Skip on fork PRs — GITHUB_TOKEN can't push to forks.
      # Authors from forks see CI complete without auto-commit; they push regen manually.
      - name: Commit derived JSONs back to PR
        if: steps.diff.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-context/dist/ paths-manifest.json package.json package-lock.json
          git commit -m "chore(app-context): regenerate dist from src records + bump patch"
          # Race-safe push: another derive workflow may have pushed to this
          # branch since checkout (concurrent auto-commits) — rebase and retry
          # once instead of failing the required check on a lost race.
          # --autostash: npm install rewrites the stale tracked package-lock.json
          # in every run, and a dirty tree makes a bare rebase refuse to start.
          git push || (git pull --rebase --autostash && git push)

      - name: Summarize
        if: always()
        run: |
          if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            echo "### App-context derive: regenerated" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### App-context derive: no changes" >> "$GITHUB_STEP_SUMMARY"
          fi
