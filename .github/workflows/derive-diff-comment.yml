name: Derive diff PR comment

# Posts an updatable PR comment summarizing which dist files will change as a
# result of running derive scripts on the PR branch vs main.
#
# Surface: non-engineering authors editing source MD/JSON via the GitHub web
# UI see exactly which auto-generated artifacts will move when their PR merges.
# Keeps language plain (added / modified / removed file lists + 1-line context).
# No impact analysis — that comes later if authors ask for it.
#
# Idempotent: uses peter-evans/create-or-update-comment so subsequent pushes
# update the same comment instead of spamming the PR thread.

on:
  pull_request:
    paths:
      - 'foundations/src/**'
      - 'content/src/**'
      - 'components/src/categories/**'
      - 'scripts/foundations/**'
      - 'scripts/content/**'
      - 'scripts/derive-diff/**'
      - '.github/workflows/derive-diff-comment.yml'

jobs:
  derive-diff:
    name: Run derive on PR + base, diff outputs, post comment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Run derives on PR branch
        run: |
          npm run derive:foundations
          npm run derive:content || true

      - name: Snapshot PR dist output
        run: |
          node scripts/derive-diff/compute-derive-diff.js \
            --snapshot \
            --dir foundations/dist \
            --dir content/dist \
            --dir components/dist \
            --out /tmp/snapshot-pr.json

      - name: Checkout base branch
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git checkout origin/${{ github.event.pull_request.base.ref }}

      - name: Install deps (base)
        run: npm install --no-audit --no-fund

      - name: Run derives on base branch
        run: |
          npm run derive:foundations
          npm run derive:content || true

      - name: Snapshot base dist output
        run: |
          node scripts/derive-diff/compute-derive-diff.js \
            --snapshot \
            --dir foundations/dist \
            --dir content/dist \
            --dir components/dist \
            --out /tmp/snapshot-base.json

      - name: Compute diff markdown
        id: diff
        run: |
          node scripts/derive-diff/compute-derive-diff.js \
            --diff \
            --before /tmp/snapshot-base.json \
            --after /tmp/snapshot-pr.json > /tmp/diff.md
          {
            echo 'body<<DIFF_EOF'
            cat /tmp/diff.md
            echo 'DIFF_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Find existing derive-diff comment
        uses: peter-evans/find-comment@v3
        id: find
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- derive-diff-comment -->'

      - name: Create or update PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            <!-- derive-diff-comment -->
            ${{ steps.diff.outputs.body }}
          edit-mode: replace
