name: Derive knowledge graph JSON from substrate

# Mirrors categories-derive.yml / guidelines-derive.yml, but for the knowledge
# graph (graph/dist/graph.json), which is DOWNSTREAM of several other domains.
#
# Why this workflow exists:
#   graph/dist/graph.json was previously only *guarded* (a drift check in
#   validate-manifest.yml that fails if the committed graph is stale), with no
#   workflow to regenerate it. Every other derived dist (categories, guidelines,
#   foundations, accessibility) has a derive workflow that auto-commits its dist
#   back to the PR. The graph had the guard but not the auto-commit, so any
#   content-changing sync PR (e.g. sync-from-figma) left graph.json stale and
#   failed the guard with no self-healing path. This workflow closes that gap:
#   it regenerates the graph and commits it back, so the guard becomes a pure
#   backstop that passes once this workflow has run.
#
# DOWNSTREAM trigger set: unlike the per-domain derives (which trigger only on
#   their own src), the graph reads the *dist* outputs of other domains. So this
#   triggers on those dist paths too — when foundations-derive / accessibility-
#   derive / categories-derive auto-commit their dist, that commit re-triggers
#   this workflow, which then regenerates the graph from the updated dists. The
#   cascade converges: the last run (after all upstreams settle) produces the
#   correct graph. graph/dist/graph.json (the OUTPUT) and package.json (bumped
#   below) are intentionally NOT in the trigger set, so this workflow's own
#   auto-commit does not re-trigger it.
#
# Required repo setting (already enabled for sync-from-figma workflow):
#   Settings → Actions → General → Workflow permissions → Allow GH Actions
#     to create and approve pull requests
#
# The auto-commit pushes with the actian-ds-bot App token (vars.BOT_APP_ID +
# secrets.BOT_APP_PRIVATE_KEY) so it re-triggers the required checks on the new
# HEAD SHA — a GITHUB_TOKEN push cannot. Shared with categories/guidelines.

on:
  pull_request:
    paths:
      # Graph inputs (see scripts/graph/derive-graph.js):
      # — component registries (synced directly by sync-from-figma)
      - 'components/dist/registries/dskit.json'
      - 'components/dist/registries/fmkit.json'
      - 'components/dist/registries/metakit.json'
      # — curated category-override stopgap (readCategoryOverrides in
      #   scripts/graph/derive-graph.js): registry-less-category components
      #   pinned to a category until their Figma pages are reorganized. See
      #   components/src/category-overrides.json _meta for provenance +
      #   self-retirement condition.
      - 'components/src/category-overrides.json'
      # — category-defaults (derived + auto-committed by categories-derive.yml)
      - 'components/dist/categories/**'
      # — component guidelines (derived + auto-committed by guidelines-derive.yml,
      #   which pushes with the App token so this re-triggers). Source of
      #   component-tier a11y_ref edges (scripts/graph/derive-graph.js
      #   readGuidelineDocs → collectComponentRefs). Without this path, a
      #   component a11y_ref change never re-triggers the graph rebuild, so
      #   graph.json stays stale and graph-coverage fails with no self-heal.
      - 'components/dist/guidelines/**'
      # — accessibility index (derived by accessibility-derive.yml)
      - 'accessibility/dist/a11y-index.json'
      # — foundations bundle + motion tokens (derived by foundations-derive.yml)
      - 'foundations/dist/foundations.bundle.json'
      - 'foundations/dist/tokens/motion.json'
      # — content source (UX-pattern topics read directly from content/src)
      - 'content/src/**/*.md'
      # app-context consolidated dist (apps/entities/terminology/patterns),
      # derived + auto-committed by app-context-derive.yml. Source of the
      # app-context island (collectAppContext in scripts/graph/derive-graph.js).
      - 'app-context/dist/app-context.json'
      # — the derive itself + its libs + the validating schema
      - 'scripts/graph/**'
      - 'scripts/lib/graph/**'
      - 'scripts/lib/frontmatter.js'
      - 'scripts/lib/dist-io.js'
      - 'schemas/graph.json'
      # hand-authored JSON-LD @context (governs graph/dist/graph.jsonld)
      - 'graph/context.jsonld'
      # graph/dist/graph.json (OUTPUT) and package.json (bumped below) are
      # intentionally excluded — including them would self-retrigger this run.

# Serialize runs per branch: concurrent auto-commit pushes to the same PR
# head race each other (lost push = red required check). Queue, never cancel:
# cancelling mid-push could strand a half-committed dist.
concurrency:
  group: graph-derive-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  derive:
    name: Derive knowledge graph JSON
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # App token for the auto-commit push below. A commit pushed with the
      # default GITHUB_TOKEN cannot trigger further workflow runs, leaving the
      # required checks with no status on the auto-commit's SHA and blocking
      # merge. Skipped on fork PRs — BOT_APP_PRIVATE_KEY is not exposed to
      # them; checkout then falls back to github.token (the commit step
      # already skips on forks).
      - name: Generate App token
        id: app-token
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Derive knowledge graph
        run: npm run derive:graph

      - name: Validate regenerated graph
        run: npm run validate:graph

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- graph/dist/graph.json graph/dist/quality-report.json graph/dist/graph.jsonld graph/dist/collisions.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No graph changes after regeneration."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Graph changes detected:"
            git diff --stat -- graph/dist/graph.json graph/dist/quality-report.json graph/dist/graph.jsonld graph/dist/collisions.json
          fi

      - name: Auto-bump package.json patch
        if: steps.diff.outputs.changed == 'true'
        run: |
          node scripts/lib/bump-version.js package.json patch

      # Skip on fork PRs — GITHUB_TOKEN can't push to forks.
      # Authors from forks see CI complete without auto-commit; they push regen manually.
      - name: Commit derived graph back to PR
        if: steps.diff.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graph/dist/graph.json graph/dist/graph.jsonld graph/dist/quality-report.json graph/dist/collisions.json package.json paths-manifest.json package-lock.json
          git commit -m "chore(graph): regenerate dist from substrate + bump patch"
          # Race-safe push: another derive workflow may have pushed to this
          # branch since checkout (concurrent auto-commits) — rebase and retry
          # once instead of failing the required check on a lost race.
          # --autostash: npm install rewrites the stale tracked package-lock.json
          # in every run, and a dirty tree makes a bare rebase refuse to start.
          git push || (git pull --rebase --autostash && git push)

      - name: Summarize
        if: always()
        run: |
          if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            echo "### Graph derive: regenerated" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Graph derive: no changes" >> "$GITHUB_STEP_SUMMARY"
          fi
