name: Derive per-component guideline JSONs from components/src/<slug>/

# Phase 2a — per-component multi-domain guideline pipeline. Mirrors
# categories-derive.yml. Triggers on changes to per-component source files
# (_meta.yml + the per-domain markdown/YAML) or the derive scripts/schemas.
# Regenerates components/dist/guidelines/<slug>.json + guidelines.bundle.json
# + coverage.md + paths-manifest.json entries, then auto-commits the dist
# back to the PR branch.
#
# Required repo setting (already enabled for the other derive workflows):
#   Settings → Actions → General → Workflow permissions → Allow GH Actions
#     to create and approve pull requests

on:
  pull_request:
    paths:
      - 'components/src/*/_meta.yml'
      - 'components/src/*/content.md'
      - 'components/src/*/usage.md'
      - 'components/src/*/design.md'
      - 'components/src/*/behavior.md'
      - 'components/src/*/tokens.yml'
      - 'scripts/components/**'
      - 'schemas/guideline-component.json'
      - 'schemas/guideline-meta.json'
      - 'schemas/guideline-tokens.json'
      # paths-manifest.json is intentionally NOT a trigger — it's an OUTPUT
      # of this workflow (auto-regenerated by derive-guidelines.js).

jobs:
  derive:
    name: Derive per-component guideline JSONs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Derive per-component guideline JSONs
        run: node scripts/components/__cli.js

      - name: Run tests against regenerated output
        run: npm test

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- components/dist/guidelines/ paths-manifest.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dist changes after regeneration."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Dist changes detected:"
            git diff --stat -- components/dist/guidelines/ paths-manifest.json
          fi

      - name: Auto-bump package.json patch
        if: steps.diff.outputs.changed == 'true'
        run: node scripts/lib/bump-version.js package.json patch

      # Skip on fork PRs — GITHUB_TOKEN can't push to forks.
      - name: Commit derived JSONs back to PR
        if: steps.diff.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/dist/guidelines/ paths-manifest.json package.json
          git commit -m "chore(components): regenerate guideline JSONs from components/src/ + bump patch"
          git push

      # Skip on fork PRs — GITHUB_TOKEN can't push tags to forks.
      - name: Tag release
        if: steps.diff.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          VERSION=$(jq -r .version package.json)
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists locally, skipping"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION" || echo "Tag push failed (likely already exists on remote)"
          fi

      - name: Summarize
        if: always()
        run: |
          if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            echo "### Guidelines derive: regenerated" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Guidelines derive: no changes" >> "$GITHUB_STEP_SUMMARY"
          fi
