name: Regenerate llms.txt

# Regenerates llms.txt + llms-full.txt from the latest content after each
# push to main that touches a source path. Opens an auto-merging PR via
# the actian-ds-bot App (not a direct push to main) so:
#   1. Branch-protection rules (required PRs + status checks) are honoured.
#   2. The PR fires pull_request workflows normally (validate-manifest etc.),
#      which a default GITHUB_TOKEN-authored PR would not.
#
# Required repo secrets:
#   BOT_APP_PRIVATE_KEY   — PEM private key for the actian-ds-bot GitHub App.
#
# Required repo variables:
#   BOT_APP_ID            — actian-ds-bot App ID (currently 3678502).

on:
  push:
    branches: [main]
    paths:
      - 'foundations/**'
      - 'content/**'
      - 'accessibility/**'
      - 'components/dist/**'
      - 'paths-manifest.json'
  workflow_dispatch: {}

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # llms-txt-generate.js requires `marked` transitively (via
      # derive-foundations → scripts/lib/section-dist), which is a
      # devDependency — so deps MUST be installed before regenerating.
      # Matches the install step used by the derive workflows.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Mint App token so the regen PR is authored by actian-ds-bot —
      # required for branch-protected main (direct push fails) and for
      # downstream pull_request workflows to fire on the PR.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Regenerate llms.txt + llms-full.txt
        run: node scripts/llms-txt-generate.js

      - name: Open auto-merging PR if changed
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: "chore: regenerate llms.txt from latest content"
          title: "chore: regenerate llms.txt"
          body: |
            Auto-regeneration of `llms.txt` + `llms-full.txt` triggered by a push to
            `main` that touched a source path (foundations, content, accessibility,
            components/dist, or paths-manifest).

            Generated by `.github/workflows/llms-txt.yml` via
            `scripts/llms-txt-generate.js`.
          branch: "chore/regenerate-llms-txt"
          labels: chore,auto-merge
          delete-branch: true
          add-paths: |
            llms.txt
            llms-full.txt

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr merge "${{ steps.cpr.outputs.pull-request-number }}" --auto --squash --repo "${{ github.repository }}"

      - name: Summarize
        if: always()
        run: |
          if [ -n "${{ steps.cpr.outputs.pull-request-number }}" ]; then
            echo "### llms.txt PR opened: #${{ steps.cpr.outputs.pull-request-number }}" >> "$GITHUB_STEP_SUMMARY"
            echo "${{ steps.cpr.outputs.pull-request-url }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### llms.txt: no changes detected" >> "$GITHUB_STEP_SUMMARY"
          fi
