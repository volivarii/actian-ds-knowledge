name: Derive foundations JSON from foundations.md

# Federation Phase 1.2 — knowledge-repo CI lifted from
# Actian-DS-Claude-plugin/.github/workflows/foundations-derive.yml.
# Runs on PR events that touch the source MD or parser. Regenerates the
# foundation JSONs and pushes them back to the PR branch. Designers never
# need a local toolchain — they edit MD, CI handles the rest.
#
# Required repo setting (already enabled for sync-from-figma workflow):
#   Settings → Actions → General → Workflow permissions → Allow GH Actions
#     to create and approve pull requests

on:
  pull_request:
    paths:
      - 'foundations/src/foundations.md'
      - 'scripts/foundations/derive-foundations.js'
      - 'scripts/foundations/foundations-parser/**'

jobs:
  derive:
    name: Derive foundations JSONs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Derive foundations JSONs (schema-less)
        run: |
          node scripts/foundations/derive-foundations.js \
            --md foundations/src/foundations.md \
            --out foundations/dist

      - name: Run tests against regenerated output
        run: npm test

      - name: Detect changes
        id: diff
        run: |
          # Derive also rewrites foundations.* entries in paths-manifest.json.
          if git diff --quiet -- foundations/ paths-manifest.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No JSON / manifest changes after regeneration."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git diff --stat -- foundations/ paths-manifest.json
          fi

      - name: Auto-bump package.json patch
        if: steps.diff.outputs.changed == 'true'
        run: |
          node scripts/lib/bump-version.js package.json patch

      - name: Commit derived JSONs back to PR
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add foundations/ paths-manifest.json package.json
          git commit -m "chore(foundations): regenerate JSONs + manifest from foundations.md + bump patch"
          git push

      - name: Tag release
        if: steps.diff.outputs.changed == 'true'
        run: |
          VERSION=$(jq -r .version package.json)
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists locally, skipping"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION" || echo "Tag push failed (likely already exists on remote)"
          fi

      - name: Post semantic-diff comment
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/workflows/scripts/foundations-pr-comment.js

      - name: Summarize
        if: always()
        run: |
          if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            echo "### Foundations derive: regenerated" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Foundations derive: no changes" >> "$GITHUB_STEP_SUMMARY"
          fi
