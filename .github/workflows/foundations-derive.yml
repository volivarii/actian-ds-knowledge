name: Derive foundations JSON from foundations/src/

# Federation Phase 1.2 — knowledge-repo CI lifted from
# Actian-DS-Claude-plugin/.github/workflows/foundations-derive.yml.
# Runs on PR events that touch the source MD or parser. Regenerates the
# foundation JSONs AND the live token snapshot (tokens.json/css + DTCG
# src + token-reference.md), then pushes them back to the PR branch.
# Designers never need a local toolchain — they edit MD, CI handles the rest.
#
# foundations/src/*.md is a dual-consumer source: it feeds foundations/dist
# (derive:foundations) and the live token snapshot (derive:tokens). Both must
# regenerate in the SAME job/commit so a token-binding edit never leaves the
# tokens artifacts stale (which the parity/freshness gates fail-closed on).
#
# Required repo setting (already enabled for sync-from-figma workflow):
#   Settings → Actions → General → Workflow permissions → Allow GH Actions
#     to create and approve pull requests
#
# The auto-commit pushes with the actian-ds-bot App token (vars.BOT_APP_ID +
# secrets.BOT_APP_PRIVATE_KEY) so it re-triggers the required checks on the new
# HEAD SHA — a GITHUB_TOKEN push cannot. Shared with guidelines-derive.yml.

on:
  pull_request:
    paths:
      - 'foundations/src/**'
      - 'scripts/foundations/derive-foundations.js'
      - 'scripts/foundations/foundations-parser/**'
      - 'scripts/lib/frontmatter.js'
      - 'scripts/lib/dist-io.js'
      - 'paths-manifest.json'
      # Token deriver inputs + code — a token-only edit must also regenerate
      # the live snapshot, not just foundations/src/*.md edits.
      - 'tokens/src/**'
      - 'scripts/tokens/**'

# Serialize runs per branch: concurrent auto-commit pushes to the same PR
# head race each other (lost push = red required check). Queue, never cancel:
# cancelling mid-push could strand a half-committed dist.
concurrency:
  group: foundations-derive-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  derive:
    name: Derive foundations JSONs
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # App token for the auto-commit push below. A commit pushed with the
      # default GITHUB_TOKEN cannot trigger further workflow runs, leaving the
      # required checks with no status on the auto-commit's SHA and blocking
      # merge. Skipped on fork PRs — BOT_APP_PRIVATE_KEY is not exposed to
      # them; checkout then falls back to github.token.
      - name: Generate App token
        id: app-token
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Derive foundations JSONs (Pattern H — hierarchical)
        run: |
          node scripts/foundations/derive-foundations.js \
            --src-dir foundations/src \
            --out foundations/dist

      # Token snapshot is derived from the same foundations/src/*.md sources.
      # Regenerate it here so the freshness/parity gates in `npm test` below
      # run against fresh artifacts, and the commit step picks up the result.
      - name: Derive token snapshot (live tokens.json/css + DTCG src + reference)
        run: |
          npm run derive:tokens
          npm run render:tokens

      - name: Run tests against regenerated output
        run: npm test

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- foundations/ tokens/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No JSON changes after regeneration."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "JSON changes detected:"
            git diff --stat -- foundations/ tokens/
          fi

      - name: Auto-bump package.json patch
        if: steps.diff.outputs.changed == 'true'
        run: |
          node scripts/lib/bump-version.js package.json patch

      # Skip on fork PRs — GITHUB_TOKEN can't push to forks.
      - name: Commit derived JSONs back to PR
        if: steps.diff.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add foundations/ tokens/ package.json paths-manifest.json
          git commit -m "chore(foundations): regenerate foundations + token JSONs from src + bump patch"
          # Race-safe push: another derive workflow may have pushed to this
          # branch since checkout (concurrent auto-commits) — rebase and retry
          # once instead of failing the required check on a lost race.
          # --autostash: npm install rewrites the stale tracked package-lock.json
          # in every run, and a dirty tree makes a bare rebase refuse to start.
          git push || (git pull --rebase --autostash && git push)

      - name: Post semantic-diff comment
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/workflows/scripts/foundations-pr-comment.js

      - name: Summarize
        if: always()
        run: |
          if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            echo "### Foundations derive: regenerated" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Foundations derive: no changes" >> "$GITHUB_STEP_SUMMARY"
          fi
