name: Deploy editor to Pages

on:
  push:
    branches: [main]
    paths:
      - editor/**
      - .github/workflows/editor-deploy.yml
      # The deployed bundle carries knowledge CONTENT, not just editor code:
      # `npm run build` generates the search body index from these trees
      # (editor/scripts/gen-search-bodies.ts). Without them a merge that adds
      # or rewrites guidance never redeploys, so the editor keeps searching the
      # text as it stood at the last editor/ change and finds nothing for a
      # sentence that is now on the page. Not committing the index is what
      # keeps that mechanical diff off content authors' PRs; this is the other
      # half of that choice.
      - components/src/**
      - foundations/src/**
      - accessibility/src/**
      - app-context/src/**
      - content/src/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Build job runs untrusted npm code; deny pages:write/id-token:write here.
    # The deploy job inherits the workflow-level grants.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Restructure dist for subpath
        run: |
          mkdir -p ../_site/editor
          cp -r dist/* ../_site/editor/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
