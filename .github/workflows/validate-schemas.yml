name: Validate schemas

# Schema-validation CI gate. Runs Ajv against the live artifacts on every PR
# that touches a relevant source/dist path. Violations are surfaced inline on
# the PR diff via reviewdog so non-engineering authors (who use the GitHub web
# UI) see them in the Files-Changed view.
#
# Validators (Phase 5, knowledge v0.11.0):
#   - validate-manifest-schema.js     → paths-manifest.json structural shape
#   - validate-foundations-dist.js    → foundations/dist/**/*.json (post-derive)
#   - validate-category-defaults.js   → components/src/categories/*.md frontmatter (PR δ)
#   - validate-registries.js          → components/dist/registries/*.json (ζ.3)
#   - validate-guidelines-doc.js      → components/src/<slug>/{_meta,tokens}.yml +
#                                       components/dist/guidelines/*.json (Phase 2a)
#
# Retired Phase 5: validate-guidelines.js (scraped components/src/guidelines/
# layer is gone).

on:
  pull_request:
    paths:
      - 'components/src/categories/**/*.md'
      - 'components/src/*/_meta.yml'
      - 'components/src/*/tokens.yml'
      - 'components/dist/guidelines/**/*.json'
      - 'components/dist/registries/**/*.json'
      - 'paths-manifest.json'
      - 'domains.json'
      - 'foundations/dist/**/*.json'
      - 'accessibility/dist/**/*.json'
      - 'content/dist/**/*.json'
      - 'schemas/**/*.json'
      - 'scripts/validate/**'
      - '.github/workflows/validate-schemas.yml'

jobs:
  validate:
    name: Schema validation + reviewdog annotations
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Setup reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Validate paths-manifest schema
        id: manifest
        continue-on-error: true
        run: |
          node scripts/validate/validate-manifest-schema.js > manifest.rdjsonl
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Validate foundations dist
        id: foundations
        continue-on-error: true
        run: |
          node scripts/validate/validate-foundations-dist.js > foundations.rdjsonl
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Validate category MD frontmatter
        id: categories
        continue-on-error: true
        run: |
          node scripts/validate/validate-category-defaults.js > categories.rdjsonl
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Validate component registries (ζ.3)
        id: registries
        continue-on-error: true
        run: |
          node scripts/validate/validate-registries.js > registries.rdjsonl
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Validate per-component guideline docs (Phase 2a)
        id: guidelines_doc
        continue-on-error: true
        run: |
          node scripts/validate/validate-guidelines-doc.js > guidelines-doc.rdjsonl
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Validate accessibility sections
        id: a11y_sections
        continue-on-error: true
        run: |
          node scripts/validate/validate-a11y-sections.js > a11y-sections.rdjsonl
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Validate accessibility index
        id: a11y_index
        continue-on-error: true
        run: |
          node scripts/validate/validate-a11y-index.js > a11y-index.rdjsonl
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Validate content dist
        id: content
        continue-on-error: true
        run: |
          node scripts/validate/validate-content.js > content.rdjsonl
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Validate anatomy dist
        id: anatomy
        continue-on-error: true
        run: |
          node scripts/validate/validate-anatomy.js > anatomy.rdjsonl
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Validate domains registry
        id: domains
        continue-on-error: true
        run: |
          node scripts/validate/validate-domains.js > domains.rdjsonl
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Combine rdjsonl outputs
        run: cat manifest.rdjsonl foundations.rdjsonl categories.rdjsonl registries.rdjsonl guidelines-doc.rdjsonl a11y-sections.rdjsonl a11y-index.rdjsonl content.rdjsonl anatomy.rdjsonl domains.rdjsonl > combined.rdjsonl

      - name: Report annotations via reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat combined.rdjsonl | reviewdog \
            -f=rdjsonl \
            -name="schema-validation" \
            -reporter=github-pr-check \
            -level=error \
            -fail-on-error=false || true

      - name: Fail job if any validator reported errors
        run: |
          if [ -s combined.rdjsonl ]; then
            echo "Schema violations found — see PR Check annotations for details."
            cat combined.rdjsonl
            exit 1
          fi
          echo "All schemas valid."
