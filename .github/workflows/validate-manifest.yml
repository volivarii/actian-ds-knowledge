name: Validate manifest

# Required PR gate. Three-part:
#   (0) npm run sync:version — stamp paths-manifest.json#knowledge_version from
#       package.json#version (it is DERIVED, never hand-edited), and auto-commit
#       any drift back to the PR branch BEFORE the validate/test step runs.
#   (1) scripts/validate-manifest.js — schema + path resolution + no orphans
#   (2) npm test — manifest test suite + content-derive test suite
#
# Runs on EVERY PR (no paths: filter). Avoids the path-filtered-required-check
# dead-PR gotcha: required status checks that have paths: filters create a
# permanent "pending" state for unrelated PRs that don't trigger the workflow.
# Total runtime ~10s, negligible CI cost.

on:
  pull_request:

# Serialize runs per branch: concurrent auto-commit pushes to the same PR
# head race each other (lost push = red required check). Queue, never cancel:
# cancelling mid-push could strand a half-committed dist.
concurrency:
  group: validate-manifest-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate manifest schema + coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # App token for the stamp auto-commit push below. Mirrors
      # guidelines-derive.yml: a commit pushed with the default GITHUB_TOKEN
      # cannot trigger further workflow runs, which would leave the required
      # checks with no status on the auto-commit's SHA and block merges. The
      # actian-ds-bot App token re-triggers them on the new HEAD SHA. Skipped on
      # fork PRs — BOT_APP_PRIVATE_KEY is not exposed to them; checkout then
      # falls back to github.token (read-only, but the commit step also skips on
      # forks, so the validate/test steps still run on the unstamped tree).
      - name: Generate App token
        id: app-token
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install deps
        run: npm install --no-audit --no-fund

      # knowledge_version is DERIVED from package.json#version, never hand-edited.
      # Stamp it here so a PR that bumped package.json (or hand-edited the field)
      # can never land with the two out of sync. Runs BEFORE validate/test so the
      # gate sees the corrected tree. No-op when already synced (byte-identical
      # rewrite is suppressed by the helper).
      - name: Stamp knowledge_version from package.json
        run: npm run sync:version

      - name: Detect manifest drift
        id: diff
        run: |
          if git diff --quiet -- paths-manifest.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "knowledge_version already in sync."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "knowledge_version drifted — stamped from package.json:"
            git diff -- paths-manifest.json
          fi

      # Skip on fork PRs — GITHUB_TOKEN can't push to forks. On same-repo PRs the
      # push uses the App token so the required checks re-run on the new HEAD SHA;
      # a GITHUB_TOKEN push could NOT re-trigger them (the recurring gotcha
      # documented in CLAUDE.md / guidelines-derive.yml), leaving the stamped SHA
      # without a status and blocking merge — an empty-commit nudge would then be
      # needed. The App token avoids that.
      - name: Commit stamped manifest back to PR
        if: steps.diff.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paths-manifest.json
          git commit -m "chore(version): stamp knowledge_version from package.json"
          # Race-safe push: another derive workflow may have pushed to this
          # branch since checkout (concurrent auto-commits) — rebase and retry
          # once instead of failing the required check on a lost race.
          # --autostash: npm install rewrites the stale tracked package-lock.json
          # in every run, and a dirty tree makes a bare rebase refuse to start.
          git push || (git pull --rebase --autostash && git push)

      - name: Validate manifest
        run: node scripts/validate-manifest.js

      - name: Derive knowledge graph
        run: npm run derive:graph

      - name: Validate knowledge graph
        run: npm run validate:graph

      - name: Graph drift guard (committed graph.json + quality-report.json + collisions.json must match regeneration)
        run: |
          if ! git diff --quiet -- graph/dist/graph.json graph/dist/quality-report.json graph/dist/collisions.json; then
            echo "::error::graph/dist/{graph,quality-report,collisions}.json is stale — run 'npm run derive:graph && npm run validate:graph' and commit."
            git diff -- graph/dist/graph.json graph/dist/quality-report.json graph/dist/collisions.json
            exit 1
          fi

      # Re-derive + git-diff drift guards for the snapshot-fixture domains
      # (replaces the removed tests/snapshots/*-dist.snapshot.json fixtures —
      # same re-derive-and-compare gate as graph above, one source of truth =
      # the committed dist). The per-domain *-derive.yml workflows auto-commit
      # the regenerated dist back to the PR, so an editor source-only edit
      # self-heals; this guard is the belt-and-suspenders that fails if stale
      # dist is ever committed directly.
      - name: Derive foundations
        run: npm run derive:foundations

      - name: Foundations dist drift guard (committed foundations/dist must match regeneration)
        run: |
          if ! git diff --quiet -- foundations/dist; then
            echo "::error::foundations/dist is stale — run 'npm run derive:foundations' and commit."
            git --no-pager diff --stat -- foundations/dist
            exit 1
          fi

      - name: Derive accessibility
        run: npm run derive:accessibility

      - name: Accessibility dist drift guard (committed accessibility/dist must match regeneration)
        run: |
          if ! git diff --quiet -- accessibility/dist; then
            echo "::error::accessibility/dist is stale — run 'npm run derive:accessibility' and commit."
            git --no-pager diff --stat -- accessibility/dist
            exit 1
          fi

      # llms.txt + llms-full.txt are the content INDEX, and both ship to
      # consumers (vendor-include.json). A stale index is not cosmetic drift: it
      # is the first thing an AI consumer reads to find anything else, so a
      # retired heading left in it is the ghost-reference problem (#517)
      # reintroduced by release mechanics. Before #525 every published tag
      # carried an index that did not describe its own content, because the regen
      # ran on push to main AFTER tag-on-merge had already cut the tag. This is
      # the assertion that makes staleness un-mergeable no matter which workflow
      # regenerates, and it runs LAST of the drift guards because the llms full
      # dump reads content/dist/global.md plus the foundations/accessibility
      # sources the guards above have already settled.
      #
      # Deliberately a step here rather than a test in `npm test`: the sibling
      # derive workflows run `npm test` before their auto-commit step, so an
      # llms-full assertion inside the suite would fail mid-cascade and block
      # them from committing the dist they exist to produce, breaking the
      # "authors need no local toolchain" guarantee. tests/llms-txt-freshness.test.js
      # covers the cascade-independent half (llms.txt) in the suite.
      - name: Derive llms index
        run: npm run derive:llms

      - name: llms index drift guard (committed llms.txt + llms-full.txt must match regeneration)
        run: |
          if ! git diff --quiet -- llms.txt llms-full.txt; then
            echo "::error::llms.txt / llms-full.txt is STALE: the committed index does not describe the content committed alongside it. Run 'npm run derive:llms' and commit the result. Both files are vendored to consumers (vendor-include.json) and consumers resolve by tag, so a stale index ships inside the release tag (#525)."
            echo "Files that drifted (committed -> regenerated):"
            git --no-pager diff --stat -- llms.txt llms-full.txt
            git --no-pager diff -- llms.txt
            exit 1
          fi
          echo "llms index is current."

      # The identity ledger carries no authoring surface, so it registers no
      # domains.json unit (see INFRA_DERIVES in validate-domains.js). That
      # exemption is only honest if freshness is asserted here instead: a stale
      # ledger resolves a renamed-away slug to the wrong component, or fails to
      # resolve it at all, and it ships inside the release tag either way.
      - name: Update the identity ledger
        run: npm run derive:identity

      - name: Identity ledger drift guard (committed components/dist/identity.json must match regeneration)
        run: |
          # `git diff` reports nothing for an untracked file, so a PR that deletes
          # the ledger would see the derive re-create it and the guard print
          # "current" while the file is absent from the commit. --porcelain covers
          # deleted, untracked and modified alike, so the guard asserts its own
          # postcondition rather than one case of it.
          if [ -n "$(git status --porcelain -- components/dist/identity.json)" ]; then
            echo "::error::components/dist/identity.json is STALE: the committed ledger does not describe the registries committed alongside it. Run 'npm run derive:identity' and commit the result. clients/resolve-paths.js reads this to resolve a slug a component was renamed away from, so a stale ledger silently mis-resolves."
            echo "Drift (committed -> regenerated):"
            git --no-pager diff -- components/dist/identity.json
            exit 1
          fi
          echo "identity ledger is current."

      - name: Run test suite
        run: npm test

      - name: Token reference in sync with tokens.json
        run: |
          npm run render:tokens
          if ! git diff --quiet -- tokens/token-reference.md; then
            echo "::error::tokens/token-reference.md is stale — run 'npm run render:tokens' and commit."
            git --no-pager diff -- tokens/token-reference.md
            exit 1
          fi

      # TAG-GAP visibility (REPORT-ONLY; the hard version-bump gate remains
      # paused by decision): consumers vendor by tag range, so a merge that
      # changes vendorable dist/manifest content without a version bump is
      # invisible to them until some later PR bumps (bit twice: #333/#335).
      # The sync bumps itself now; this flags the remaining human-PR case.
      # May warn transiently mid-derive-cascade before a derive workflow
      # auto-bumps — that is fine, it never fails the check.
      - name: TAG-GAP notice — vendorable content vs version bump (report-only)
        if: always()
        run: |
          git fetch origin "${{ github.base_ref }}" --quiet || true
          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- \
            'components/dist/**' 'tokens/**' 'foundations/dist/**' \
            'content/dist/**' 'accessibility/dist/**' 'app-context/dist/**' \
            'graph/dist/**' 'paths-manifest.json' 2>/dev/null | head -50) || true
          [ -z "$CHANGED" ] && exit 0
          BASE_V=$(git show "$BASE:package.json" 2>/dev/null | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).version)}catch(e){console.log('')}})")
          HEAD_V=$(node -e "console.log(require('./package.json').version)")
          if [ -n "$BASE_V" ] && [ "$BASE_V" = "$HEAD_V" ]; then
            {
              echo "### ⚠️ TAG-GAP notice (report-only)"
              echo ""
              echo "This PR changes vendorable content without a version bump. Tag-range consumers (plugin/docs vendor pulls) will not see the change until a later bump. Changed vendorable files:"
              echo '```'
              echo "$CHANGED"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "TAG-GAP notice: vendorable content changed without a version bump (see job summary)."
          fi
