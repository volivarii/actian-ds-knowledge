name: Validate manifest

# Required PR gate. Runs scripts/validate-manifest.js, which checks that
# (1) paths-manifest.json schema is valid, (2) every entry's path/dir
# resolves to a real file, and (3) no orphan files exist under content
# directories without being covered by the manifest.
#
# Fires on any change to the manifest itself or content directories.

on:
  pull_request:
    paths:
      - 'paths-manifest.json'
      - 'scripts/validate-manifest.js'
      - 'foundations/**'
      - 'components/**'
      - 'tokens/**'
      - 'content/**'
      - 'accessibility/**'
      - 'presentation/**'
      - 'app-context/**'
      - 'fm-to-ds-map/**'

jobs:
  validate:
    name: Validate manifest schema + coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Validate
        run: node scripts/validate-manifest.js
